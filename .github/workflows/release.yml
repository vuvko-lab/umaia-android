name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.0.1)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/umaia-release.jks"

      - name: Resolve version info
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_NAME="${{ github.ref_name }}"
            VERSION_NAME="${VERSION_NAME#v}"
          else
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Write local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
          KEYSTORE_PATH=${{ runner.temp }}/umaia-release.jks
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=umaia
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed APK
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }} \
            --no-daemon

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/umaia-${{ steps.version.outputs.version_name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: umaia-${{ steps.version.outputs.version_name }}-apk
          path: app/build/outputs/apk/release/umaia-${{ steps.version.outputs.version_name }}.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Umaia ${{ steps.version.outputs.version_name }}"
          body: |
            ## Umaia ${{ steps.version.outputs.version_name }}

            ### Install
            Download `umaia-${{ steps.version.outputs.version_name }}.apk` and sideload it.
            Enable **Install from unknown sources** in Android settings if prompted.

            - versionCode: ${{ steps.version.outputs.version_code }}
            - Built from: ${{ github.sha }}
          files: |
            app/build/outputs/apk/release/umaia-${{ steps.version.outputs.version_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
