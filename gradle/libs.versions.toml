[versions]
agp                 = "8.9.1"
kotlin              = "2.0.21"
ksp                 = "2.0.21-1.0.27"
compose-bom         = "2024.09.03"
hilt                = "2.52"
ktor                = "2.3.12"
serialization       = "1.7.3"
datastore           = "1.1.1"
security            = "1.1.0-alpha06"
posthog             = "3.40.2"
coroutines          = "1.9.0"
turbine             = "1.2.0"
mockk               = "1.13.12"
lifecycle           = "2.8.6"
navigation          = "2.8.3"
okhttp              = "4.12.0"
appcompat           = "1.7.0"
work                = "2.9.1"
hilt-work           = "1.2.0"

[libraries]
compose-bom                     = { group = "androidx.compose", name = "compose-bom",                     version.ref = "compose-bom" }
compose-ui                      = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling              = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview      = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3               = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-foundation              = { group = "androidx.compose.foundation", name = "foundation" }
compose-runtime                 = { group = "androidx.compose.runtime", name = "runtime" }

navigation-compose              = { group = "androidx.navigation", name = "navigation-compose",           version.ref = "navigation" }

lifecycle-viewmodel-compose     = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose",   version.ref = "lifecycle" }
lifecycle-runtime-compose       = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",     version.ref = "lifecycle" }

hilt-android                    = { group = "com.google.dagger", name = "hilt-android",                  version.ref = "hilt" }
hilt-compiler                   = { group = "com.google.dagger", name = "hilt-android-compiler",         version.ref = "hilt" }
hilt-navigation-compose         = { group = "androidx.hilt",     name = "hilt-navigation-compose",       version = "1.2.0" }

ktor-client-android             = { group = "io.ktor", name = "ktor-client-android",                     version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation",         version.ref = "ktor" }
ktor-serialization-json         = { group = "io.ktor", name = "ktor-serialization-kotlinx-json",         version.ref = "ktor" }
ktor-client-logging             = { group = "io.ktor", name = "ktor-client-logging",                     version.ref = "ktor" }

okhttp                          = { group = "com.squareup.okhttp3", name = "okhttp",                     version.ref = "okhttp" }
appcompat                       = { group = "androidx.appcompat", name = "appcompat",                    version.ref = "appcompat" }
okhttp-logging                  = { group = "com.squareup.okhttp3", name = "logging-interceptor",        version.ref = "okhttp" }

kotlinx-serialization           = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines              = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

datastore-preferences           = { group = "androidx.datastore", name = "datastore-preferences",        version.ref = "datastore" }
security-crypto                 = { group = "androidx.security",  name = "security-crypto",              version.ref = "security" }

credentials                     = { group = "androidx.credentials", name = "credentials",                version = "1.3.0" }
credentials-play-services       = { group = "androidx.credentials", name = "credentials-play-services-auth", version = "1.3.0" }
googleid                        = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version = "1.1.1" }

health-connect                  = { group = "androidx.health.connect", name = "connect-client",         version = "1.1.0-rc03" }

work-runtime                    = { group = "androidx.work",   name = "work-runtime-ktx",                version.ref = "work" }
hilt-work                       = { group = "androidx.hilt",   name = "hilt-work",                       version.ref = "hilt-work" }
hilt-androidx-compiler          = { group = "androidx.hilt",   name = "hilt-compiler",                   version.ref = "hilt-work" }

posthog                         = { group = "com.posthog", name = "posthog-android",                    version.ref = "posthog" }

paparazzi                       = { group = "app.cash.paparazzi", name = "paparazzi",                   version = "1.3.4" }
junit4                          = { group = "junit", name = "junit",                                      version = "4.13.2" }
mockk                           = { group = "io.mockk", name = "mockk",                                  version.ref = "mockk" }
turbine                         = { group = "app.cash.turbine", name = "turbine",                        version.ref = "turbine" }
coroutines-test                 = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",   version.ref = "coroutines" }

[plugins]
android-application  = { id = "com.android.application",                      version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",                  version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",           version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",     version.ref = "kotlin" }
hilt                 = { id = "com.google.dagger.hilt.android",                version.ref = "hilt" }
ksp                  = { id = "com.google.devtools.ksp",                       version.ref = "ksp" }
paparazzi            = { id = "app.cash.paparazzi",                            version = "1.3.4" }
